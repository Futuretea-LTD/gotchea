# CI: typecheck, lint, test and build on every PR and every push to main.
name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Least privilege: CI only needs to read the repo.
permissions:
  contents: read

# Cancel superseded runs for the same PR / branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - name: Check out repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # pnpm version comes from the root package.json `packageManager` field.
      # pnpm 11 itself requires Node >= 22.13, so install the standalone build
      # (@pnpm/exe, ships its own runtime). Project scripts still run on the
      # matrix Node version installed below.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          standalone: true

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
